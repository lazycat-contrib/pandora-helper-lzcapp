lzc-sdk-version: "0.1"
name: Pandora Helper
package: cloud.lazycat.app.pandora-helper
version: 1.3.6
description: 轻松和您的好友分享Claude账号的服务
homepage: https://github.com/nianhua99/PandoraHelper/
author: nianhua99
application:
  subdomain: pandora-helper
  background_task: true

  public_path:
    - /
  routes:
    - /=http://pandora-helper:9000/
services:
  pandora-helper:
    # q11391/pandora-helper
    image: registry.lazycat.cloud/czyt/q11391/pandora-helper:400f5b4b52729004
    binds:
      - /lzcapp/var/data:/app/data
    setup_script: |
      if [ ! -f /app/data/config.json ]; then
        cp /lzcapp/pkg/content/config.json /app/data/config.json
      fi

locales:
  zh:
    name: Pandora Helper
    description: 轻松和您的好友分享Claude账号的服务

  en:
    name: Pandora Helper
    description: A service that allows you to easily share your Claude account with your friends
